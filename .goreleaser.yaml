# GoReleaser configuration. Docs: https://goreleaser.com
# Local dry run: make snapshot
version: 2

project_name: portcheck

before:
  hooks:
    - go mod download
    - ./scripts/release-assets.sh

builds:
  - id: portcheck
    main: ./cmd/portcheck
    binary: portcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/roystondwork-dev/portcheck/internal/buildinfo.version={{ .Version }}
      - -X github.com/roystondwork-dev/portcheck/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/roystondwork-dev/portcheck/internal/buildinfo.date={{ .CommitDate }}
    # Reproducible builds: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (requires syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with Sigstore (GitHub OIDC). The bundle
# contains the signature and certificate; see docs/install.md#verifying-downloads.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

nfpms:
  - id: packages
    package_name: portcheck
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: portcheck contributors
    homepage: https://roystondwork-dev.github.io/portcheck/
    maintainer: Royston D <roystondwork-dev@users.noreply.github.com>
    description: See what's using your ports, find free ones, free them up, and check remote hosts.
    license: MIT
    section: net
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: ./completions/portcheck.bash
        dst: /usr/share/bash-completion/completions/portcheck
        file_info: { mode: 0644 }
      - src: ./completions/portcheck.zsh
        dst: /usr/share/zsh/site-functions/_portcheck
        file_info: { mode: 0644 }
      - src: ./completions/portcheck.fish
        dst: /usr/share/fish/vendor_completions.d/portcheck.fish
        file_info: { mode: 0644 }
      - src: ./manpages/*.1.gz
        dst: /usr/share/man/man1/
        file_info: { mode: 0644 }
      - src: ./LICENSE
        dst: /usr/share/doc/portcheck/copyright
        file_info: { mode: 0644 }

homebrew_casks:
  - name: portcheck
    repository:
      owner: roystondwork-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://roystondwork-dev.github.io/portcheck/
    description: See what's using your ports, find free ones, free them up, and check remote hosts
    license: MIT
    commit_author:
      name: portcheck-release-bot
      email: roystondwork-dev@users.noreply.github.com
    completions:
      bash: completions/portcheck.bash
      zsh: completions/portcheck.zsh
      fish: completions/portcheck.fish
    manpages:
      - manpages/portcheck.1.gz
    # Binaries are not notarized by Apple; clear the quarantine flag on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/portcheck"]
          end

scoops:
  - name: portcheck
    repository:
      owner: roystondwork-dev
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://roystondwork-dev.github.io/portcheck/
    description: See what's using your ports, find free ones, free them up, and check remote hosts.
    license: MIT
    commit_author:
      name: portcheck-release-bot
      email: roystondwork-dev@users.noreply.github.com

# winget: GoReleaser writes the manifest to our fork of microsoft/winget-pkgs
# and opens a pull request upstream, where Microsoft validates and merges it.
winget:
  - name: portcheck
    package_identifier: RoystonD.portcheck
    publisher: Royston D
    publisher_url: https://github.com/roystondwork-dev
    publisher_support_url: https://github.com/roystondwork-dev/portcheck/issues
    author: Royston D and portcheck contributors
    homepage: https://roystondwork-dev.github.io/portcheck/
    short_description: See what's using your ports, find free ones, free them up, and check remote hosts.
    description: |-
      portcheck shows which processes own local TCP and UDP ports, checks whether ports
      are free, finds free ports, safely stops the process holding a port, and checks
      ports on remote hosts. It has script-friendly JSON output and exit codes, and an
      interactive terminal UI.
    license: MIT
    license_url: https://github.com/roystondwork-dev/portcheck/blob/main/LICENSE
    copyright: Copyright (c) 2026 Royston D and portcheck contributors
    release_notes_url: "https://github.com/roystondwork-dev/portcheck/releases/tag/{{ .Tag }}"
    tags: [ports, network, netstat, lsof, cli, tui, developer-tools]
    commit_author:
      name: portcheck-release-bot
      email: roystondwork-dev@users.noreply.github.com
    repository:
      owner: roystondwork-dev
      name: winget-pkgs
      branch: "portcheck-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: roystondwork-dev
    name: portcheck
  # release-please creates the release with curated notes; GoReleaser only adds assets.
  mode: keep-existing
  prerelease: auto

changelog:
  disable: true
