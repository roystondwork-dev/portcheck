name: Raycast extension

on:
  push:
    branches: [main]
    paths: [extensions/raycast/**, .github/workflows/raycast.yml]
  pull_request:
    paths: [extensions/raycast/**, .github/workflows/raycast.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/raycast

jobs:
  raycast:
    name: Raycast extension
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build portcheck (for the real-binary test)
        working-directory: .
        run: go build -o bin/portcheck ./cmd/portcheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/raycast/package-lock.json
      - run: npm ci
      - name: Lint and format
        # `ray lint` also checks the author against raycast.com; the Raycast
        # Store runs it when the extension is submitted.
        run: |
          npx eslint src
          npx prettier --check src
      - name: Test (unit, then the real portcheck)
        env:
          PORTCHECK_BIN: ${{ github.workspace }}/bin/portcheck
        run: npx vitest run
      - name: Build
        run: npx ray build -e dist
