name: Dev Container feature

# Tests the portcheck Dev Container feature (devcontainer-features/) in real
# containers, and publishes it to ghcr.io/roystondwork-dev/portcheck/portcheck
# when it changes on main. The feature has its own version, in
# devcontainer-feature.json; bump it to publish a change.
on:
  push:
    branches: [main]
    paths: [devcontainer-features/**, docs/install.sh, .github/workflows/devcontainer-feature.yml]
  pull_request:
    paths: [devcontainer-features/**, docs/install.sh, .github/workflows/devcontainer-feature.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test the feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The feature runs the project's installer, which verifies checksums.
      - run: cp docs/install.sh devcontainer-features/src/portcheck/portcheck-install.sh
      - name: Debian, Ubuntu and the scenarios (pinned version, Alpine)
        working-directory: devcontainer-features
        run: |
          npx --yes @devcontainers/cli@0.80.2 features test --features portcheck \
            --base-image mcr.microsoft.com/devcontainers/base:debian .
          npx --yes @devcontainers/cli@0.80.2 features test --features portcheck \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu --skip-scenarios .

  publish:
    name: Publish the feature
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp docs/install.sh devcontainer-features/src/portcheck/portcheck-install.sh
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./devcontainer-features/src
        env:
          GITHUB_TOKEN: ${{ github.token }}
