# Coverage gate enforced by `make cover-check` and CI.
# See docs/development.md#coverage-policy for the policy.
profile: coverage.out
local-prefix: github.com/roystondwork-dev/portcheck

threshold:
  file: 90
  package: 95
  total: 95

override:
  # The public library is held to full line coverage.
  - path: ^pkg/
    threshold: 100

exclude:
  paths:
    # main() only wires os.Exit around cli.Execute, which is tested directly.
    - ^cmd/portcheck/main\.go$
    # The tray app's OS glue (systray adapter, clipboard, browser); its logic is
    # internal/tray, tested to 100%.
    - ^cmd/portcheck-tray/
    # Test helpers and doc generator are not shipped code.
    - ^internal/testutil/
    - ^internal/cli/gendocs/
