version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
    ignore:
      # Must match the minimum VS Code in engines.vscode (vsce rejects newer types).
      - dependency-name: "@types/vscode"
      # Must match the Node.js major that VS Code's extension host runs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Mocha 12 is ESM-only; the extension host of older VS Code can't load it.
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
    groups:
      npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
