name: MCP Registry

# Publishes a release's server.json to the official MCP Registry by hand, e.g.
# when the release's own attempt failed. The release workflow normally does
# this right after publishing to npm.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.12.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry login (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # The script comes from main, so a fixed script can publish an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
        run: main/scripts/mcp-publish.sh
