name: JetBrains plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: extensions/jetbrains

jobs:
  plugin:
    name: JetBrains plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build portcheck (for the real-binary test)
        working-directory: .
        shell: bash
        run: go build -o "bin/portcheck$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/portcheck
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test (unit, headless IDE, real portcheck) with the coverage gate
        shell: bash
        env:
          PORTCHECK_BIN: ${{ github.workspace }}/bin/portcheck${{ runner.os == 'Windows' && '.exe' || '' }}
        run: ./gradlew test koverVerify koverLog buildPlugin --console=plain
      - name: Check compatibility with current IDEs (Plugin Verifier)
        if: runner.os == 'Linux'
        run: ./gradlew verifyPlugin --console=plain
