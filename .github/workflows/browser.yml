name: Browser extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: extensions/browser

jobs:
  extension:
    name: Browser extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows registers native hosts in the registry; that path is covered
        # by the Go tests on Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build portcheck
        working-directory: .
        run: go build -o bin/portcheck ./cmd/portcheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, unit tests (100% coverage gate), bundle
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests in Chromium
        run: npm run build:store && npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: extensions/browser/test-results/
          retention-days: 7

  firefox:
    name: Browser extension (Firefox)
    # Selenium drives the system Firefox; GitHub's Ubuntu images include it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build portcheck
        working-directory: .
        run: go build -o bin/portcheck ./cmd/portcheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - run: npm ci
      - name: Build the Firefox add-on and validate it with Mozilla's linter
        run: |
          npm run build:firefox
          npx --yes web-ext@10.8.0 lint --source-dir dist-firefox
      - name: End-to-end tests in Firefox
        run: node --test e2e-firefox/firefox.test.mjs

