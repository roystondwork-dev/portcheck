name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
        **Security issues:** do not file here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
      placeholder: |
        Ran `portcheck check 3000` while a node server was listening...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `portcheck version --json`
      render: json
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Run with elevated privileges?
      options: ["No", "Yes (sudo / Administrator)"]
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (run with `--verbose`)
      render: shell
