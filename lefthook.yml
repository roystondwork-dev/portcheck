# Git hooks. Install once with: lefthook install
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files} && git add {staged_files}
      stage_fixed: true
    mod-tidy:
      glob: "go.{mod,sum}"
      run: go mod tidy -diff

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$' || {
          echo "Commit message must follow Conventional Commits, e.g. 'feat(scan): add CIDR support'"; exit 1; }

pre-push:
  parallel: true
  commands:
    lint:
      run: golangci-lint run ./...
    test:
      run: go test -race -count=1 ./...
