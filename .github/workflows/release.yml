name: Release

# 1. On every push to main, release-please maintains a "chore: release x.y.z" PR
#    with the changelog and version bump derived from Conventional Commits.
# 2. Merging that PR makes release-please tag vX.Y.Z and create the GitHub
#    release; the goreleaser job then builds, signs and publishes the artifacts.
# 3. The vscode job packages the VS Code extension with the binaries from those
#    artifacts (all platforms in one VSIX) and publishes it.
# 4. The browser job packages the browser extension as a zip for the release.
# See docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish artifacts for, e.g. v0.1.0
        required: true
      vscode_only:
        description: >-
          Only (re)package and publish the VS Code extension: the extension from the
          branch this runs on, with portcheck from that tag's release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT lets CI run on the release PR (PRs opened with GITHUB_TOKEN don't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.vscode_only))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # keyless cosign signing + provenance
      attestations: write  # SLSA build provenance
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Decide which publishers to run
        id: skip
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          # winget submissions are paused while the first one waits for Microsoft's
          # review (each release would open a new PR); set this variable to "true"
          # to resume. See docs/releasing.md.
          WINGET_SUBMIT: ${{ vars.WINGET_SUBMIT }}
        run: |
          skip=""
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping Homebrew and Scoop publishing"
            skip="homebrew,scoop"
          fi
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_GITHUB_TOKEN is not set; skipping the winget submission"
            skip="${skip:+$skip,}winget"
          elif [ "$WINGET_SUBMIT" != "true" ]; then
            echo "::notice::winget submissions are paused (repository variable WINGET_SUBMIT is not \"true\")"
            skip="${skip:+$skip,}winget"
          fi
          if [ -n "$skip" ]; then echo "args=--skip=$skip" >> "$GITHUB_OUTPUT"; fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean ${{ steps.skip.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

  vscode:
    needs: [release-please, goreleaser]
    if: >-
      always() &&
      (needs.goreleaser.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.vscode_only))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the VSIX to the release
      id-token: write      # provenance
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vscode_only packages the extension as it is now; a release packages the tag.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.vscode_only) && github.sha || env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: npm ci
      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -D "$RUNNER_TEMP/assets" -p checksums.txt -p checksums.txt.sigstore.json -p '*.tar.gz' -p '*.zip'
          # The binaries go into the extension, so check they are the signed release's.
          cosign verify-blob "$RUNNER_TEMP/assets/checksums.txt" \
            --bundle "$RUNNER_TEMP/assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Package the VSIX (portcheck for every platform inside)
        run: scripts/package-release.sh "${TAG#v}" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/vsix"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/vsix/*.vsix
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/vsix/*.vsix --clobber
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; skipping the VS Code Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath "$RUNNER_TEMP"/vsix/*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; skipping Open VSX"
            exit 0
          fi
          # The namespace must exist and match the publisher; creating it again fails harmlessly.
          npx ovsx create-namespace "$(node -p 'require("./package.json").publisher')" || true
          npx ovsx publish "$RUNNER_TEMP"/vsix/*.vsix

  browser:
    needs: [release-please, goreleaser]
    if: >-
      always() &&
      (needs.goreleaser.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.vscode_only))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the zip to the release
      id-token: write      # provenance
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: extensions/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.vscode_only) && github.sha || env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - run: npm ci
      - name: Build and zip the extension
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::extensions/browser/package.json has $version, expected ${TAG#v} (release-please keeps them in sync)"
            exit 1
          fi
          npm run build
          (cd dist && zip -qr "$RUNNER_TEMP/portcheck-browser-$version.zip" .)
          # For store uploads: without the manifest key (stores assign the ID).
          npm run build:store
          (cd dist-store && zip -qr "$RUNNER_TEMP/portcheck-browser-store-$version.zip" .)
          # Firefox: the add-on for addons.mozilla.org, and its source for the
          # reviewers, who rebuild it (see BUILD-FIREFOX.md).
          npm run build:firefox
          (cd dist-firefox && zip -qr "$RUNNER_TEMP/portcheck-firefox-$version.zip" .)
          git archive --format=zip -o "$RUNNER_TEMP/portcheck-firefox-source-$version.zip" HEAD:extensions/browser
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/portcheck-browser-*.zip
            ${{ runner.temp }}/portcheck-firefox-*.zip
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/portcheck-browser-*.zip "$RUNNER_TEMP"/portcheck-firefox-*.zip --clobber
